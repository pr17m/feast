<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Feast</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div class="brand">
        <img src="icon.png" alt="" width="72" height="72" />
        <h1 id="app-name">Feast</h1>
        <p id="tagline"></p>
      </div>
      <section id="picker" hidden>
        <h2>Where are you dining?</h2>
        <p class="muted">You can change this later in the app.</p>
        <ul id="countries"></ul>
      </section>
      <section id="opening" hidden>
        <p class="muted">Opening <span id="opening-country"></span>…</p>
      </section>
      <section id="not-configured" hidden>
        <h2>This build isn't set up yet</h2>
        <p class="muted">Add the live site address for <b id="nc-country"></b> to <code>mobile/shared/countries.json</code>, then run <code>npm run build</code> and rebuild the app.</p>
        <button type="button" class="secondary" id="nc-back">Choose another country</button>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="start.js"></script>
  </body>
</html>
