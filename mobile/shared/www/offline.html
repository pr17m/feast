<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Feast — offline</title>
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <main id="app">
      <div class="brand">
        <img src="icon.png" alt="" width="72" height="72" />
        <h1>You're offline</h1>
        <p class="muted">Feast needs an internet connection. Check your connection and try again.</p>
      </div>
      <button type="button" id="retry">Try again</button>
      <button type="button" class="secondary" id="change">Change country</button>
    </main>
    <script src="config.js"></script>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace("index.html");
      });
      document.getElementById("change").addEventListener("click", function () {
        window.location.replace("index.html?change=1");
      });
    </script>
  </body>
</html>
