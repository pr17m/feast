        isPureVeg:
          type: boolean
        name:
          type: string
        phone:
          type: string
        tags:
          items:
            type: string
          type: array
      type: object
    RestaurantQr:
      additionalProperties: false
      description: What a scanned restaurant QR (`/r/{code}`, or an old table code) opens.
      properties:
        code:
          type: string
        restaurant:
          $ref: '#/components/schemas/RestaurantSummary'
      required:
      - code
      - restaurant
      type: object
    RestaurantRef:
      additionalProperties: false
      description: Small restaurant reference embedded in bookings, payments, cases and reviews.
      properties:
        area:
          type: string
        art:
          additionalProperties: false
          description: Cover photo (`image`) plus the generated-art fallback (hue + motif).
          properties:
            hue:
              type: number
            image:
              type: string
            imageCredit:
              type: string
            motif:
              $ref: '#/components/schemas/CuisineMotif'
          required:
          - hue
          - motif
          type: object
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      required:
      - id
      - slug
      - name
      - area
      - art
      type: object
    RestaurantSettings:
      additionalProperties: false
      description: Owner-controlled switches. Admins can change them for any restaurant.
      properties:
        billPaymentEnabled:
          type: boolean
        bookingsEnabled:
          type: boolean
        dailyDealLimit:
          description: Most discounted bills per day (absent = unlimited). Past it, bills are payable without the deal.
          type: number
        maxDiscountPerBill:
          $ref: '#/components/schemas/Paise'
          description: Most a Feast deal may take off one bill, whatever the offer says (minor units; absent = no cap).
        tablesPerSlot:
          description: Tables offered per 30-minute slot.
          type: number
      required:
      - bookingsEnabled
      - billPaymentEnabled
      - tablesPerSlot
      type: object
    RestaurantSettingsPatch:
      additionalProperties: false
      description: Absent = unchanged; `null` clears the cap/limit.
      properties:
        billPaymentEnabled:
          type: boolean
        bookingsEnabled:
          type: boolean
        dailyDealLimit:
          type:
          - number
          - 'null'
        maxDiscountPerBill:
          anyOf:
          - $ref: '#/components/schemas/Paise'
          - type: 'null'
        tablesPerSlot:
          description: Tables offered per 30-minute slot.
          type: number
      type: object
    RestaurantStatus:
      description: 'ONBOARDING: owner is filling details and uploading documents. PENDING_APPROVAL: submitted; Feast admins
        are reviewing the documents. LIVE / PAUSED: approved (PAUSED = owner temporarily stopped bookings/payments). SUSPENDED:
        taken down by an admin.'
      enum:
      - ONBOARDING
      - PENDING_APPROVAL
      - LIVE
      - PAUSED
      - SUSPENDED
      type: string
    RestaurantSummary:
      additionalProperties: false
      properties:
        acceptsBillPayment:
          type: boolean
        acceptsBookings:
          type: boolean
        area:
          type: string
        art:
          additionalProperties: false
          description: Cover photo (`image`) plus the generated-art fallback (hue + motif).
          properties:
            hue:
              type: number
            image:
              type: string
            imageCredit:
              type: string
            motif:
              $ref: '#/components/schemas/CuisineMotif'
          required:
          - hue
          - motif
          type: object
        cityId:
          type: string
        costForTwo:
          $ref: '#/components/schemas/Paise'
        countryCode:
          type: string
        cuisines:
          items:
            type: string
          type: array
        currency:
          description: ISO 4217 currency for every amount about this restaurant.
          type: string
        distanceKm:
          type: number
        headlineOffer:
          type: string
        id:
          type: string
        isPureVeg:
          type: boolean
        name:
          type: string
        priceBand:
          $ref: '#/components/schemas/PriceBand'
        rating:
          type: number
        ratingCount:
          type: number
        slug:
          type: string
        tags:
          items:
            type: string
          type: array
      required:
      - id
      - slug
      - name
      - cityId
      - area
      - cuisines
      - rating
      - ratingCount
      - costForTwo
      - priceBand
      - currency
      - countryCode
      - distanceKm
      - isPureVeg
      - tags
      - art
      - acceptsBookings
      - acceptsBillPayment
      type: object
    Review:
      additionalProperties: false
      properties:
        authorName:
          description: '"Kavya R."'
          type: string
        billPaymentId:
          type: string
        bookingId:
          type: string
        createdAt:
          $ref: '#/components/schemas/ISODateTime'
        flag:
          additionalProperties: false
          description: The restaurant reported it to Feast.
          properties:
            at:
              $ref: '#/components/schemas/ISODateTime'
            reason:
              type: string
          required:
          - reason
          - at
          type: object
        id:
          type: string
        moderation:
          $ref: '#/components/schemas/Moderation'
        rating:
          type: number
        reply:
          additionalProperties: false
          properties:
            at:
              $ref: '#/components/schemas/ISODateTime'
            text:
              type: string
          required:
          - text
          - at
          type: object
        restaurant:
          $ref: '#/components/schemas/RestaurantRef'
        status:
          $ref: '#/components/schemas/ReviewStatus'
        text:
          type: string
        userId:
          description: Absent in public lists.
          type: string
        visitDate:
          $ref: '#/components/schemas/ISODate'
      required:
      - id
      - restaurant
      - authorName
      - visitDate
      - rating
      - text
      - createdAt
      - status
      type: object
    ReviewList:
      additionalProperties: false
      properties:
        reviews:
          items:
            $ref: '#/components/schemas/Review'
          type: array
        summary:
          $ref: '#/components/schemas/ReviewSummary'
      required:
      - summary
      - reviews
      type: object
    ReviewReplyRequest:
      additionalProperties: false
      properties:
        text:
          type: string
      required:
      - text
      type: object
    ReviewStatus:
      enum:
      - PUBLISHED
      - HIDDEN
      type: string
    ReviewSummary:
      additionalProperties: false
      properties:
        average:
          type: number
        count:
          type: number
        distribution:
          description: index 0 = 1★ … 4 = 5★ (Feast reviews only).
          items:
            type: number
          type: array
      required:
      - average
      - count
      - distribution
      type: object
    Role:
      description: 'CUSTOMER: diners. OWNER: restaurant partners, scoped to `restaurantIds`. ADMIN: platform operators — can
        do everything an owner can, for every restaurant.'
      enum:
      - CUSTOMER
      - OWNER
      - ADMIN
      type: string
    SearchFacets:
      additionalProperties: false
      description: Filters are derived from live listing data (cuisines, experiences, area, cost for two, offers and services
        that owners manage), never hard-coded. Options with no matches are omitted unless currently selected.
      properties:
        areas:
          items:
            $ref: '#/components/schemas/Facet'
          type: array
        cuisines:
          items:
            $ref: '#/components/schemas/Facet'
          type: array
        offers:
          items:
            $ref: '#/components/schemas/Facet'
          type: array
        priceBands:
          items:
            $ref: '#/components/schemas/Facet'
          type: array
        pureVeg:
          description: Pure-veg restaurants matching the other filters (0 → hide the chip).
          type: number
        services:
          items:
            $ref: '#/components/schemas/Facet'
          type: array
        tags:
          items:
            $ref: '#/components/schemas/Facet'
          type: array
      required:
      - cuisines
      - tags
      - areas
      - priceBands
      - offers
      - services
      - pureVeg
      type: object
    SearchQuery:
      additionalProperties: false
      properties:
        area:
          type: string
        cuisine:
          type: string
        minRating:
          type: number
        offer:
          $ref: '#/components/schemas/OfferScope'
        priceBand:
          $ref: '#/components/schemas/PriceBand'
        pureVeg:
          type: boolean
        q:
          type: string
        service:
          $ref: '#/components/schemas/SearchService'
        sort:
          enum:
          - relevance
          - rating
          - distance
          - costLow
          - costHigh
          type: string
        tag:
          type: string
      type: object
    SearchResponse:
      additionalProperties: false
      properties:
        facets:
          $ref: '#/components/schemas/SearchFacets'
        restaurants:
          items:
            $ref: '#/components/schemas/RestaurantSummary'
          type: array
        total:
          type: number
      required:
      - total
      - restaurants
      - facets
      type: object
    SearchService:
      description: What a diner can do there on Feast (driven by the owner's service toggles).
      enum:
      - BOOKINGS
      - BILL_PAYMENT
      type: string
    Settlement:
      description: 'Who handled the money: Feast''s payment provider, or the restaurant at its counter.'
      enum:
      - ONLINE
      - OFFLINE
      type: string
    Slot:
      additionalProperties: false
      properties:
        available:
          type: boolean
        deal:
          $ref: '#/components/schemas/Offer'
          description: Deal attached to this slot. Off-peak slots carry bigger discounts.
        id:
          type: string
        period:
          $ref: '#/components/schemas/MealPeriod'
        seatsLeft:
          type: number
        time:
          type: string
      required:
      - id
      - time
      - period
      - available
      - seatsLeft
      type: object
    SlotAvailability:
      additionalProperties: false
      properties:
        date:
          $ref: '#/components/schemas/ISODate'
        guests:
          type: number
        restaurantId:
          type: string
        slots:
          items:
            $ref: '#/components/schemas/Slot'
          type: array
      required:
      - restaurantId
      - date
      - guests
      - slots
      type: object
    Subscription:
      additionalProperties: false
      properties:
        daysLeft:
          description: Whole days until `endsAt` (negative once overdue).
          type: number
        endsAt:
          $ref: '#/components/schemas/ISODateTime'
          description: When the current trial/paid period ends.
        hiddenAfter:
          $ref: '#/components/schemas/ISODateTime'
          description: When the listing is hidden if still unpaid (endsAt + grace).
        listed:
          description: Visible to diners right now (besides the restaurant being LIVE/PAUSED).
          type: boolean
        paidThrough:
          $ref: '#/components/schemas/ISODateTime'
          description: End of the paid period, if ever paid.
        planId:
          $ref: '#/components/schemas/PlanId'
          description: Last plan paid for.
        restaurantId:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        trialEndsAt:
          $ref: '#/components/schemas/ISODateTime'
      required:
      - restaurantId
      - status
      - listed
      type: object
    SubscriptionOverview:
      additionalProperties: false
      properties:
        methods:
          description: Methods the market's payment provider offers.
          items:
            $ref: '#/components/schemas/PaymentMethod'
          type: array
        payments:
          items:
            $ref: '#/components/schemas/PlatformPayment'
          type: array
        plans:
          items:
            $ref: '#/components/schemas/SubscriptionPlan'
          type: array
        rules:
          additionalProperties: false
          properties:
            graceDays:
              type: number
            trialDays:
              type: number
          required:
          - trialDays
          - graceDays
          type: object
        subscription:
          $ref: '#/components/schemas/Subscription'
      required:
      - subscription
      - plans
      - payments
      - rules
      - methods
      type: object
    SubscriptionPlan:
      additionalProperties: false
      properties:
        currency:
          type: string
        id:
          $ref: '#/components/schemas/PlanId'
        months:
          type: number
        name:
          type: string
        price:
          $ref: '#/components/schemas/Paise'
          description: Price before tax.
        savePercent:
          description: Saving vs paying monthly, in percent.
          type: number
        taxName:
          type: string
        taxPercent:
          type: number
        total:
          $ref: '#/components/schemas/Paise'
          description: Price including tax.
      required:
      - id
      - name
      - months
      - currency
      - price
      - taxName
      - taxPercent
      - total
      type: object
    SubscriptionStatus:
      description: 'Restaurants list on Feast free for a trial period from when they first go live, then pay a subscription.
        Unpaid listings get a grace period, then are hidden from diners until paid. Rules: src/lib/api/subscription.ts.'
      enum:
      - NOT_STARTED
      - TRIAL
      - ACTIVE
      - PAST_DUE
      - EXPIRED
      type: string
    SupportAccess:
      additionalProperties: false
      properties:
        activeUntil:
          $ref: '#/components/schemas/ISODateTime'
          description: Feast staff may edit until then (absent = no access).
        audit:
          description: Newest first.
          items:
            $ref: '#/components/schemas/AuditEntry'
          type: array
        staffCanEdit:
          description: Whether Feast staff may edit right now (access granted, or no owner linked yet).
          type: boolean
      required:
      - staffCanEdit
      - audit
      type: object
    SupportAccessRequest:
      additionalProperties: false
      description: Owner grants (1–72 h) or revokes (0) Feast support access.
      properties:
        hours:
          type: number
      required:
      - hours
      type: object
    UploadDocumentRequest:
      additionalProperties: false
      properties:
        expiresOn:
          $ref: '#/components/schemas/ISODate'
        file:
          additionalProperties: false
          properties:
            lastModified:
              type: number
            name:
              type: string
            size:
              type: number
            type:
              type: string
            webkitRelativePath:
              type: string
          required:
          - lastModified
          - name
          - size
          - type
          - webkitRelativePath
          type: object
        number:
          type: string
        requirementId:
          type: string
      required:
      - requirementId
      - file
      type: object
    User:
      additionalProperties: false
      properties:
        createdAt:
          $ref: '#/components/schemas/ISODateTime'
        email:
          type: string
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        restaurantIds:
          items:
            type: string
          type: array
        role:
          $ref: '#/components/schemas/Role'
        status:
          description: 'DELETED: the user deleted their account (personal data removed).'
          enum:
          - ACTIVE
          - BLOCKED
          - DELETED
          type: string
      required:
      - id
      - name
      - role
      - restaurantIds
      - status
      - createdAt
      type: object
    UserPatch:
      additionalProperties: false
      properties:
        name:
          type: string
        restaurantIds:
          items:
            type: string
          type: array
        role:
          $ref: '#/components/schemas/Role'
        status:
          description: 'DELETED: the user deleted their account (personal data removed).'
          enum:
          - ACTIVE
          - BLOCKED
          - DELETED
          type: string
      type: object
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION
        message:
          type: string
    feast_domain:
      type: object
      description: See backend/rust/crates/domain/src/model.rs
