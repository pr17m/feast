      description: 'Feast API contract — domain types shared by the web app and the backends, and (later) the Go backend and
        React Native apps.


        Conventions

        - Money is always an integer in paise (₹1 = 100). Never use floats for money.

        - Timestamps are ISO-8601 strings in UTC; dates are "YYYY-MM-DD" in the city''s timezone.

        - IDs are opaque strings.


        Keep this file framework-free so it can move into a shared package (packages/core) when the mobile apps arrive.'
      type: number
