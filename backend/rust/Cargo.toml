[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/application",
  "crates/proto",
  "crates/infra",
  "crates/notification",
  "crates/api",
  "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rusty-s3 = "0.7"
maxminddb = "0.24"
url = "2"
serde_yaml = "0.9"
# internal
feast-domain = { path = "crates/domain" }
feast-application = { path = "crates/application" }
feast-infra = { path = "crates/infra" }
feast-api = { path = "crates/api" }
feast-proto = { path = "crates/proto" }
feast-notification = { path = "crates/notification" }

# async + web
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
futures = "0.3"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "timeout", "limit", "catch-panic", "util", "set-header"] }

# grpc
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protox = "0.7"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate", "macros", "tls-rustls-ring-webpki"] }
redis = { version = "0.27", features = ["tokio-comp", "streams", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }

# time, ids, crypto
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v7"] }
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# config, errors, logging, cli
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
