[package]
name = "feast-infra"
description = "Adapters for Feast ports: SQLite repositories, message buses (in-memory, Redis Streams), auth, payments, OTP, clock, ids, demo seed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sql", "redis"]
sql = ["dep:sqlx"]
redis = ["dep:redis"]

[dependencies]
feast-domain.workspace = true
feast-application.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
argon2.workspace = true
rand.workspace = true
thiserror.workspace = true
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rusty-s3.workspace = true
maxminddb.workspace = true
url.workspace = true
serde_yaml.workspace = true
sqlx = { workspace = true, optional = true }
redis = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
uuid.workspace = true
jsonwebtoken.workspace = true
